name: release-r8-verification

on:
  push:
    branches: [ develop ]
  pull_request:
    branches:
      - develop

env:
  CI: "true"

jobs:
  release-r8-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'adopt'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run release R8 verification
        run: ./gradlew :app:releaseR8Verification -PincludeSampleApp=true -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
